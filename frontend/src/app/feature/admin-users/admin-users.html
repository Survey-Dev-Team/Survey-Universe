<gt-header />
<div class="margin-top-header"></div>

<main class="gt-admin-users">

  <!-- Hero -->
  <gt-page-header-role
    title="User Management"
    subtitle="View, inspect and manage all registered users"
    backgroundImage="/assets/images/all_surveys_top.png"
    [leftLayout]="true"/>

  <div class="container">
    <!-- ── Search ───────────────────────────────────────────────────────── -->
    <div class="gt-admin-users__toolbar">
      <gt-search placeholder="Search by name or email" (queryChange)="searchQuery.set($event)" />
      <span class="gt-admin-users__count">{{ filteredUsers().length }} users</span>
    </div>

    <!-- ── User table ──────────────────────────────────────────────────────── -->
    <gt-table
      [columns]="userColumns"
      [rows]="filteredUsers()"
      [expandable]="true"
      (rowExpand)="onRowExpand($event)"
      (deleteRow)="deleteUser($event)">

      <ng-template #expandedRow let-user>
        <div class="gt-admin-users__panel">

          <div class="gt-admin-users__panel-tabs">
            <button class="gt-admin-users__panel-tab"
              [class.gt-admin-users__panel-tab--active]="userTab() === UserTab.Surveys"
              (click)="setUserTab(UserTab.Surveys)">
              <i class="pi pi-list"></i> Surveys ({{ user.surveys.length }})
            </button>
            <button class="gt-admin-users__panel-tab"
              [class.gt-admin-users__panel-tab--active]="userTab() === UserTab.Tests"
              (click)="setUserTab(UserTab.Tests)">
              <i class="pi pi-pencil"></i> Tests ({{ user.tests.length }})
            </button>
          </div>

          @if (userTab() === UserTab.Surveys) {
            @if (user.surveys.length === 0) {
              <p class="gt-admin-users__panel-empty">No surveys completed yet.</p>
            } @else {
              <gt-table [columns]="surveysColumns" [rows]="user.surveys" />
            }
          }

          @if (userTab() === UserTab.Tests) {
            @if (user.tests.length === 0) {
              <p class="gt-admin-users__panel-empty">No tests completed yet.</p>
            } @else {
              <gt-table [columns]="testsColumns" [rows]="user.tests" />
            }
          }

        </div>
      </ng-template>

    </gt-table>

  </div>
</main>

<gt-footer />
