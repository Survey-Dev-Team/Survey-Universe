<gt-header />
<div class="margin-top-header"></div>

<main class="gt-admin-surveys">

  <!-- Hero -->
  <gt-page-header-role
    title="Surveys Management"
    subtitle="Manage all surveys — publish, edit or remove"
    [leftLayout]="true">
    <gt-button label="Create New Survey" icon="pi pi-plus" styleClass="button__fit-content" (clicked)="openCreateForm()" />
  </gt-page-header-role>

  <div class="container">
    <!-- ── Tabs ─────────────────────────────────────────────────────────── -->
    <gt-tabs [tabs]="tabItems()" [activeTab]="activeTab()" (tabChange)="setTab($any($event))" />

    <!-- ── Toolbar ───────────────────────────────────────────────────────── -->
    <div class="gt-admin-surveys__toolbar">
      <gt-search placeholder="Search by title, category or author…" (queryChange)="searchQuery.set($event)" />
      <span class="gt-admin-surveys__count">{{ displayedSurveys().length }} surveys</span>
    </div>

    <!-- ── Survey table ───────────────────────────────────────────────────── -->
    <gt-table
      [columns]="tableColumns"
      [rows]="displayedSurveys()"
      [showPublishAction]="activeTab() === SurveysTab.Unmoderated"
      (publishToggle)="togglePublish($event)"
      (editRow)="openEditForm($event)"
      (deleteRow)="deleteSurvey($event)" />

  </div>
</main>

<gt-footer />

<!-- ── Create / Edit panel ─────────────────────────────────────────────────── -->
@if (showForm() || closingForm()) {
  <div class="gt-admin-surveys__overlay" [class.gt-admin-surveys__overlay--closing]="closingForm()" (click)="closeForm()"></div>
  <aside class="gt-admin-surveys__form-panel" [class.gt-admin-surveys__form-panel--closing]="closingForm()">
    <div class="gt-admin-surveys__form-header">
      <h2 class="gt-admin-surveys__form-title">
        @if (formMode() === 'create') { Create New Survey }
        @else { Edit Survey }
      </h2>
      @if (formMode() === 'create') {
        <div class="gt-admin-surveys__form-type-toggle">
          <button
            type="button"
            class="gt-admin-surveys__form-type-btn"
            [class.gt-admin-surveys__form-type-btn--active]="formType() === 'survey'"
            (click)="formType.set('survey')"
          >
            <i class="pi pi-clipboard"></i> Survey
          </button>
          <button
            type="button"
            class="gt-admin-surveys__form-type-btn"
            [class.gt-admin-surveys__form-type-btn--active]="formType() === 'test'"
            (click)="formType.set('test')"
          >
            <i class="pi pi-check-square"></i> Test
          </button>
        </div>
      }
      <button class="gt-admin-surveys__form-close" (click)="closeForm()">
        <i class="pi pi-times"></i>
      </button>
    </div>
    <div class="gt-admin-surveys__form-body">
      @if (loadingEdit()) {
        <div class="gt-admin-surveys__form-loading">
          <i class="pi pi-spin pi-spinner"></i>
        </div>
      } @else {
      <gt-create-survey-form
        [saving]="savingForm()"
        [initialData]="editingData()"
        (formSave)="onFormSave($event)"
        (formDraft)="onFormDraft($event)"
      />
      }
    </div>
  </aside>
}
