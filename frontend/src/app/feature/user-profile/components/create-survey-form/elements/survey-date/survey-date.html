@if (element(); as el) {
  <span class="gt-survey-builder__label-row">
    <input
      class="gt-survey-builder__label-inline"
      [value]="el.label ?? ''"
      placeholder="Question label..."
      (click)="$event.stopPropagation()"
      (input)="update({ label: $any($event.target).value })"
    />
    @if (el.required) { <span class="gt-survey-builder__required">*</span> }
  </span>
  <p-datepicker
      [(ngModel)]="pickedDate"
      [placeholder]="el.placeholder || 'Select a date'"
      dateFormat="dd MM yy"
      [showIcon]="true"
      styleClass="gt-survey-builder__date-picker gt-date-picker"
      (onSelect)="onDateSelect($event)"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    />
}
