@if (element(); as el) {
  <input
    class="gt-survey-builder__label-inline"
    [value]="el.label ?? ''"
    placeholder="Question label..."
    (click)="$event.stopPropagation()"
    (input)="update({ label: $any($event.target).value })"
  />
  <div class="gt-survey-builder__select-preview">
    <i class="pi pi-chevron-down gt-survey-builder__select-icon"></i>
    <div class="gt-survey-builder__select-options">
      @for (opt of el.options; track $index) {
        <span class="gt-survey-builder__select-option">{{ opt }}</span>
      }
      @if (!el.options?.length) {
        <span class="gt-survey-builder__select-option gt-survey-builder__select-option--placeholder">No options yet</span>
      }
    </div>
  </div>
}
