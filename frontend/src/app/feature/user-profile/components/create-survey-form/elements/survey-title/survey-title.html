@if (element(); as el) {
  <h3
    class="gt-survey-builder__static-title gt-survey-builder__content-inline"
    contenteditable="true"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    (blur)="update({ content: $any($event.target).innerText })"
  >{{ el.content }}</h3>
}
