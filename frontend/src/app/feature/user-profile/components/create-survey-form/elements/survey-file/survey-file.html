@if (element(); as el) {
  <span class="gt-survey-builder__label-row">
    <input
      class="gt-survey-builder__label-inline"
      [value]="el.label ?? ''"
      placeholder="Question label..."
      (click)="$event.stopPropagation()"
      (input)="update({ label: $any($event.target).value })"
    />
    @if (el.required) { <span class="gt-survey-builder__required">*</span> }
  </span>
  <button
    type="button"
    class="gt-survey-builder__file-dropzone"
    (click)="openFilePicker($event)"
  >
    <input #fileInput type="file" hidden (change)="onFileChange($event)" />
    <img src="/assets/icons/download.svg" alt="Upload" class="gt-survey-builder__file-icon" />
    <span class="gt-survey-builder__file-hint">
      {{ selectedFileName() ?? (el.placeholder || 'Click or drag a file here') }}
    </span>
  </button>
}
