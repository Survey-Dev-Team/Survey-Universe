@if (element(); as el) {
  <input
    class="gt-survey-builder__label-inline"
    [value]="el.label ?? ''"
    placeholder="Question label..."
    (click)="$event.stopPropagation()"
    (input)="update({ label: $any($event.target).value })"
  />
  <div class="gt-survey-builder__radio-list">
    @for (opt of el.options; track $index) {
      <div class="gt-survey-builder__radio-item">
        <span class="gt-survey-builder__radio-dot"></span>
        <span>{{ opt }}</span>
      </div>
    }
  </div>
}
