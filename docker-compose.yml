version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=test
    depends_on:
      - database

  database:
    build:
      context: ./database
      dockerfile: Dockerfile.database
    container_name: couchdb_server
    restart: always
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    volumes:
      - couchdb_data:/opt/couchdb/data

  db-sync:
    build:
      context: ./database/config
      dockerfile: Dockerfile.sync
    container_name: couchdb_sync_worker
    restart: always
    volumes:
      - ./shared/data:/shared/data
    depends_on:
      - database

volumes:
  couchdb_data:
